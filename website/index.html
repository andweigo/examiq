<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamIQ — Offline-First Mobile Examination System</title>
  <link rel="icon" type="image/png" href="/assets/examiq-logo.png" />
  <link rel="apple-touch-icon" href="/assets/examiq-logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    html { scroll-behavior: smooth; overflow-x: clip; }
    body { margin: 0; background: #F5F5F2; color: #111111; overflow-x: clip; -webkit-font-smoothing: antialiased; }

    /* Display Typography: Light over Bold (Fluid across 320px -> Ultrawide) */
    .display-hero {
      font-size: clamp(1.95rem, 5vw, 4.15rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
      margin: 0;
    }
    .display-section {
      font-size: clamp(1.6rem, 3.4vw, 2.75rem);
      line-height: 1.09;
      letter-spacing: -0.03em;
      margin: 0;
    }
    .display-light { display: block; font-weight: 300; }
    .display-bold { display: block; font-weight: 700; }

    /* Signature Notched Card Motif (Direct Carry-over from Mobile App) */
    .notched-card {
      position: relative;
      border-radius: 24px;
      padding: 28px 20px 22px;
      overflow: hidden;
    }
    @media (min-width: 640px) {
      .notched-card {
        border-radius: 28px;
        padding: 32px 26px 24px;
      }
    }
    .notched-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 10px;
      background: #F5F5F2;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }
    @media (min-width: 640px) {
      .notched-card::before {
        width: 72px;
        height: 12px;
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
      }
    }
    .notched-on-dark::before {
      background: #111111;
    }

    /* Hairline Dividers */
    .hairline-b { border-bottom: 1px solid #E4E4DE; }
    .hairline-t { border-top: 1px solid #E4E4DE; }
    .hairline-dark-b { border-bottom: 1px solid #242424; }

    /* Offset anchor scroll for sticky header */
    section[id] { scroll-margin-top: 72px; }

    /* Flagship Phone Showcase Frame for Ultra-HD Vector Dashboard Display */
    .phone-display-bezel {
      width: 100%;
      max-width: min(344px, 100%);
      border-radius: 36px;
      padding: 6px;
      background: #111111;
      box-shadow: 0 24px 60px rgba(17, 17, 17, 0.16), 0 4px 16px rgba(17, 17, 17, 0.08);
      border: 1px solid #2A2A2A;
    }
    @media (min-width: 640px) {
      .phone-display-bezel {
        border-radius: 38px;
        padding: 7px;
      }
    }
    @media (min-width: 1024px) {
      .phone-display-bezel {
        max-width: 354px;
      }
    }
    .phone-display-inner {
      background: #F5F5F2;
      color: #111111;
      border-radius: 30px;
      padding: 14px 14px 12px;
    }
    @media (min-width: 375px) {
      .phone-display-inner {
        border-radius: 31px;
        padding: 16px 16px 14px;
      }
    }
    .phone-notched {
      position: relative;
      border-radius: 22px;
      padding: 20px 15px 15px;
      overflow: hidden;
    }
    .phone-notched::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 9px;
      background: #F5F5F2;
      border-bottom-left-radius: 9px;
      border-bottom-right-radius: 9px;
    }

    /* Fluid Owl SVG wrapper */
    .owl-fluid svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#F5F5F2] text-[#111111]">

  <!-- ============================================================
       SITE NAVIGATION — 3D BRAND LOGO & SECTION LINKS
       ============================================================ -->
  <header class="sticky top-0 z-40 bg-[#F5F5F2]/95 backdrop-blur-sm border-b border-[#E4E4DE]">
    <div class="max-w-[1200px] 2xl:max-w-[1320px] mx-auto px-5 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
      <!-- 3D Brand Logo Mark -->
      <button onclick="scrollToSection('overview')" class="flex items-center gap-2.5 cursor-pointer bg-transparent border-0 p-0 shrink-0">
        <img
          src="/assets/examiq-logo.png"
          alt="ExamIQ 3D Logo"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-[10px] object-cover shrink-0 shadow-[0_2px_8px_rgba(17,17,17,0.12)]"
        />
        <span class="text-[15px] sm:text-base font-bold tracking-tight text-[#111111]">ExamIQ</span>
      </button>

      <!-- Desktop Section Navigation -->
      <nav class="hidden lg:flex items-center bg-[#EAEAE5] p-1 rounded-full" aria-label="Primary navigation">
        <button id="nav-overview" onclick="scrollToSection('overview')" class="px-4 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-colors whitespace-nowrap">Overview</button>
        <button id="nav-workflow" onclick="scrollToSection('workflow')" class="px-4 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-colors whitespace-nowrap">How it works</button>
        <button id="nav-alignment" onclick="scrollToSection('alignment')" class="px-4 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-colors whitespace-nowrap">OMR &amp; Alignment</button>
        <button id="nav-download" onclick="scrollToSection('download')" class="px-4 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-colors whitespace-nowrap">Download</button>
        <button id="nav-faq" onclick="scrollToSection('faq')" class="px-4 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-colors whitespace-nowrap">FAQ</button>
      </nav>

      <!-- Primary CTA + Mobile/Tablet Menu Toggle -->
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="scrollToSection('download')" class="px-3.5 sm:px-4 py-2 rounded-full bg-[#111111] text-white text-xs font-semibold cursor-pointer hover:opacity-90 transition-opacity whitespace-nowrap">
          <span class="min-[370px]:hidden">Get APK</span>
          <span class="hidden min-[370px]:inline">Get Android APK</span>
        </button>
        <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="lg:hidden w-9 h-9 rounded-full bg-[#EAEAE5] flex items-center justify-center cursor-pointer" aria-label="Toggle menu" aria-expanded="false">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile & Tablet Nav Drawer -->
    <div id="mobile-nav" class="hidden lg:hidden border-t border-[#E4E4DE] bg-[#F5F5F2] px-5 sm:px-6 py-3.5">
      <div class="max-w-[1200px] mx-auto grid grid-cols-2 sm:flex sm:flex-wrap gap-2.5">
        <button id="mnav-overview" onclick="scrollToSection('overview'); toggleMobileMenu(false);" class="px-3.5 py-2.5 rounded-full bg-white border border-[#E4E4DE] text-xs font-semibold cursor-pointer text-center">Overview</button>
        <button id="mnav-workflow" onclick="scrollToSection('workflow'); toggleMobileMenu(false);" class="px-3.5 py-2.5 rounded-full bg-white border border-[#E4E4DE] text-xs font-semibold cursor-pointer text-center">How it works</button>
        <button id="mnav-alignment" onclick="scrollToSection('alignment'); toggleMobileMenu(false);" class="px-3.5 py-2.5 rounded-full bg-white border border-[#E4E4DE] text-xs font-semibold cursor-pointer text-center">OMR &amp; Alignment</button>
        <button id="mnav-download" onclick="scrollToSection('download'); toggleMobileMenu(false);" class="px-3.5 py-2.5 rounded-full bg-white border border-[#E4E4DE] text-xs font-semibold cursor-pointer text-center">Download</button>
        <button id="mnav-faq" onclick="scrollToSection('faq'); toggleMobileMenu(false);" class="col-span-2 sm:col-span-1 px-3.5 py-2.5 rounded-full bg-white border border-[#E4E4DE] text-xs font-semibold cursor-pointer text-center">FAQ</button>
      </div>
    </div>
  </header>

  <!-- ============================================================
       MAIN ONE-PAGER CONTAINER (ALL SECTIONS STACKED)
       ============================================================ -->
  <main id="page-root" class="flex-1 w-full"></main>

  <!-- ============================================================
       SITE FOOTER — CLEAN DARK INK SURFACE
       ============================================================ -->
  <footer class="bg-[#111111] text-[#F5F5F2] mt-auto">
    <div class="max-w-[1200px] 2xl:max-w-[1320px] mx-auto px-5 sm:px-6 lg:px-8 py-10 sm:py-12">
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6 pb-7 sm:pb-8 hairline-dark-b">
        <div class="flex items-center gap-3">
          <img
            src="/assets/examiq-logo.png"
            alt="ExamIQ 3D Logo"
            class="w-10 h-10 rounded-[11px] object-cover shrink-0 ring-1 ring-white/10"
          />
          <div>
            <div class="text-sm font-bold">ExamIQ</div>
            <div class="text-xs text-[#8E8E88] leading-relaxed mt-0.5">Offline-first mobile examination management &amp; OMR checking.</div>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-x-5 gap-y-3 text-xs text-[#A1A19A]">
          <button onclick="scrollToSection('overview')" class="hover:text-white cursor-pointer">Overview</button>
          <button onclick="scrollToSection('workflow')" class="hover:text-white cursor-pointer">How it works</button>
          <button onclick="scrollToSection('alignment')" class="hover:text-white cursor-pointer">OMR &amp; Alignment</button>
          <button onclick="scrollToSection('download')" class="hover:text-white cursor-pointer">Download APK</button>
          <button onclick="scrollToSection('faq')" class="hover:text-white cursor-pointer">FAQ</button>
        </div>
      </div>

      <div class="pt-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-xs text-[#8E8E88] leading-relaxed">
        <span>Built for Android · React Native CLI · CameraX · ML Kit · Native Kotlin OMR · SQLite</span>
        <span>© 2026 ExamIQ by Andrei Obligar · RA 10173 Offline-First</span>
      </div>
    </div>
  </footer>

  <!-- Non-blocking Toast -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 max-w-[92vw] text-center bg-[#111111] border border-[#2C2C2C] text-white text-xs font-medium px-4 py-2.5 rounded-full opacity-0 pointer-events-none transition-opacity duration-200"></div>

  <script>
    /* ============================================================
       WEBSITE STATE
       ============================================================ */
    const state = {
      activeSection: 'overview',
      heroTab: 'to-scan',
      demoAligned: true,
      demoTiles: [
        { num: 1, mark: 'A', key: 'A', type: 'correct', caption: 'Correct' },
        { num: 2, mark: 'B', key: 'C', type: 'wrong', caption: 'Key: C' },
        { num: 3, mark: 'B', key: 'B', type: 'correct', caption: 'Correct' },
        { num: 4, mark: '—', key: 'A', type: 'blank', caption: 'Blank' },
        { num: 5, mark: 'A,C', key: 'C', type: 'flagged', caption: 'Double' },
        { num: 6, mark: 'D', key: 'D', type: 'correct', caption: 'Correct' },
        { num: 7, mark: 'A', key: 'A', type: 'correct', caption: 'Correct' },
        { num: 8, mark: 'D', key: 'A', type: 'wrong', caption: 'Key: A' }
      ],
      demoScore: 38,
      openFaq: 0
    };

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('opacity-0'), 2400);
    }

    function scrollToSection(sectionId) {
      state.activeSection = sectionId === 'demo' ? 'overview' : sectionId;
      updateNavHighlight();
      const target = document.getElementById(sectionId);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function updateNavHighlight() {
      const sections = ['overview', 'workflow', 'alignment', 'download', 'faq'];
      sections.forEach(id => {
        const active = state.activeSection === id;
        const btn = document.getElementById(`nav-${id}`);
        if (btn) {
          btn.className = `px-4 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-colors whitespace-nowrap ${active ? 'bg-[#111111] text-white' : 'text-[#4A4A45] hover:text-[#111111]'}`;
        }
        const mbtn = document.getElementById(`mnav-${id}`);
        if (mbtn) {
          const spanClass = id === 'faq' ? 'col-span-2 sm:col-span-1 ' : '';
          mbtn.className = `${spanClass}px-3.5 py-2.5 rounded-full text-xs font-semibold cursor-pointer text-center transition-colors ${active ? 'bg-[#111111] text-white border border-[#111111]' : 'bg-white text-[#111111] border border-[#E4E4DE]'}`;
        }
      });
    }

    function handleScrollSpy() {
      const sections = ['overview', 'workflow', 'alignment', 'download', 'faq'];
      let current = 'overview';
      const offset = 140;
      for (const id of sections) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= offset) {
          current = id;
        }
      }
      if (current !== state.activeSection) {
        state.activeSection = current;
        updateNavHighlight();
      }
    }

    function toggleMobileMenu(force) {
      const menu = document.getElementById('mobile-nav');
      const btn = document.getElementById('mobile-menu-btn');
      const shouldOpen = typeof force === 'boolean' ? force : menu.classList.contains('hidden');
      menu.classList.toggle('hidden', !shouldOpen);
      if (btn) btn.setAttribute('aria-expanded', String(shouldOpen));
    }

    /* ============================================================
       ANIMATED DASHBOARD OWL CHARACTER (SHARED ACROSS WEBSITE)
       ============================================================ */
    function renderOwlSvg(pose = 'welcome', size = 120, uid = 'web') {
      const animStyle = `
        <style>
          .owl-bob-${uid} { transform-box: fill-box; transform-origin: center bottom; animation: owlBob-${uid} 2.8s ease-in-out infinite; }
          .owl-shadow-${uid} { transform-box: fill-box; transform-origin: center; animation: owlShadow-${uid} 2.8s ease-in-out infinite; }
          .owl-blink-${uid} { transform-box: fill-box; transform-origin: center; animation: owlBlink-${uid} 4.2s ease-in-out infinite; }
          .owl-wave-${uid} { transform-box: fill-box; transform-origin: left center; animation: owlWave-${uid} 1.8s ease-in-out infinite; }
          .owl-beam-${uid} { transform-box: fill-box; transform-origin: top center; animation: owlBeam-${uid} 1.9s ease-in-out infinite; }
          .owl-pencil-${uid} { transform-box: fill-box; transform-origin: bottom left; animation: owlPencil-${uid} 1.3s ease-in-out infinite; }
          .owl-magnify-${uid} { transform-box: fill-box; transform-origin: bottom right; animation: owlMagnify-${uid} 2.6s ease-in-out infinite; }
          .owl-shrug-${uid} { transform-box: fill-box; transform-origin: center; animation: owlShrug-${uid} 2.8s ease-in-out infinite; }
          @keyframes owlBob-${uid} { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
          @keyframes owlShadow-${uid} { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(0.92); opacity: 0.7; } }
          @keyframes owlBlink-${uid} { 0%, 44%, 48%, 94%, 98%, 100% { transform: scaleY(1); } 46%, 96% { transform: scaleY(0.08); } }
          @keyframes owlWave-${uid} { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg) translateY(-1.5px); } }
          @keyframes owlBeam-${uid} { 0%, 100% { opacity: 0.92; transform: scaleX(1); } 50% { opacity: 0.42; transform: scaleX(0.9); } }
          @keyframes owlPencil-${uid} { 0%, 100% { transform: translate(0,0) rotate(0deg); } 40% { transform: translate(-3px,-2px) rotate(-8deg); } }
          @keyframes owlMagnify-${uid} { 0%, 100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-3px,-2px) rotate(-7deg); } }
          @keyframes owlShrug-${uid} { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg) translateY(-2px); } }
        </style>
      `;

      const defs = `
        <defs>
          <radialGradient id="owlBody-${uid}" cx="36%" cy="28%" r="70%">
            <stop offset="0%" stop-color="#C2BBFF"/><stop offset="52%" stop-color="#958BFF"/><stop offset="100%" stop-color="#5E52D6"/>
          </radialGradient>
          <radialGradient id="owlBelly-${uid}" cx="45%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#FFFFFF"/><stop offset="65%" stop-color="#EBEAF8"/><stop offset="100%" stop-color="#D0CCF5"/>
          </radialGradient>
          <linearGradient id="owlGlasses-${uid}" x1="20%" y1="10%" x2="80%" y2="95%">
            <stop offset="0%" stop-color="#E4FF8F"/><stop offset="55%" stop-color="#C6F453"/><stop offset="100%" stop-color="#8BC419"/>
          </linearGradient>
          <radialGradient id="owlCoral-${uid}" cx="35%" cy="25%" r="75%">
            <stop offset="0%" stop-color="#FFA585"/><stop offset="60%" stop-color="#F67D56"/><stop offset="100%" stop-color="#C84D28"/>
          </radialGradient>
          <linearGradient id="owlWing-${uid}" x1="15%" y1="10%" x2="85%" y2="90%">
            <stop offset="0%" stop-color="#AEAAFF"/><stop offset="65%" stop-color="#7B70EE"/><stop offset="100%" stop-color="#5044BE"/>
          </linearGradient>
          <linearGradient id="scanBeam-${uid}" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#6BD4E6" stop-opacity="0.7"/><stop offset="100%" stop-color="#6BD4E6" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="owlShadow-${uid}" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#111111" stop-opacity="0.22"/><stop offset="100%" stop-color="#111111" stop-opacity="0"/>
          </radialGradient>
        </defs>
      `;

      const eyeShiftX = pose === 'review' ? 1.8 : (pose === 'empty' ? -1.8 : 0);
      const eyeShiftY = pose === 'checking' || pose === 'scanning' ? 2.2 : (pose === 'empty' ? 1.6 : 0);

      let action = '';
      if (pose === 'welcome') {
        action = `
          <path d="M25 58C15 62 13 77 20 87C24 92 31 89 32 82C33 74 31 63 25 58Z" fill="url(#owlWing-${uid})"/>
          <g class="owl-wave-${uid}">
            <path d="M95 57C105 53 111 63 107 74C104 82 95 83 91 77C88 71 90 60 95 57Z" fill="url(#owlWing-${uid})"/>
            <g transform="rotate(22 103 52)">
              <rect x="100" y="34" width="7" height="24" rx="2.5" fill="url(#owlGlasses-${uid})"/>
              <polygon points="100,35 107,35 103.5,27" fill="#F5E4C3"/>
              <polygon points="102.2,30 104.8,30 103.5,27" fill="#111111"/>
              <rect x="100" y="55" width="7" height="4.5" rx="1.8" fill="url(#owlCoral-${uid})"/>
            </g>
          </g>`;
      } else if (pose === 'scanning') {
        action = `
          <path d="M25 60C18 68 22 83 34 86C40 87 43 81 40 75C36 69 31 61 25 60Z" fill="url(#owlWing-${uid})"/>
          <path d="M95 60C102 68 98 83 86 86C80 87 77 81 80 75C84 69 89 61 95 60Z" fill="url(#owlWing-${uid})"/>
          <polygon class="owl-beam-${uid}" points="46,85 74,85 84,112 36,112" fill="url(#scanBeam-${uid})"/>
          <rect x="44" y="71" width="32" height="19" rx="5" fill="#111111" stroke="#333333" stroke-width="1.5"/>
          <circle cx="60" cy="80.5" r="5" fill="#6BD4E6"/>
          <circle cx="60" cy="80.5" r="2.2" fill="#111111"/>
          <circle cx="71" cy="75.5" r="1.6" fill="#C6F453"/>`;
      } else if (pose === 'checking') {
        action = `
          <path d="M25 60C17 66 19 80 29 85C35 87 40 82 38 75C35 69 31 62 25 60Z" fill="url(#owlWing-${uid})"/>
          <path d="M95 60C103 65 101 80 91 85C85 88 80 83 82 76C85 70 89 62 95 60Z" fill="url(#owlWing-${uid})"/>
          <rect x="34" y="75" width="34" height="27" rx="5" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
          <circle cx="42" cy="83" r="2.2" fill="#C6F453" stroke="#111111" stroke-width="1"/>
          <line x1="48" y1="83" x2="62" y2="83" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="42" cy="90" r="2.2" fill="#C6F453" stroke="#111111" stroke-width="1"/>
          <line x1="48" y1="90" x2="60" y2="90" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="42" cy="97" r="2.2" fill="#F67D56" stroke="#111111" stroke-width="1"/>
          <line x1="48" y1="97" x2="58" y2="97" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
          <g class="owl-pencil-${uid}">
            <g transform="rotate(-35 79 84)">
              <rect x="75" y="66" width="6.5" height="24" rx="2.5" fill="url(#owlGlasses-${uid})"/>
              <polygon points="75,90 81.5,90 78.25,97" fill="#F5E4C3"/>
              <polygon points="77,94 79.5,94 78.25,97" fill="#111111"/>
              <rect x="75" y="63" width="6.5" height="4" rx="1.5" fill="url(#owlCoral-${uid})"/>
            </g>
          </g>`;
      } else if (pose === 'review') {
        action = `
          <path d="M25 58C15 62 13 77 20 87C24 92 31 89 32 82C33 74 31 63 25 58Z" fill="url(#owlWing-${uid})"/>
          <g class="owl-magnify-${uid}">
            <path d="M95 57C105 53 111 63 107 74C104 82 95 83 91 77C88 71 90 60 95 57Z" fill="url(#owlWing-${uid})"/>
            <line x1="94" y1="78" x2="105" y2="93" stroke="#111111" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="88" cy="69" r="11" fill="#6BD4E6" fill-opacity="0.32" stroke="#111111" stroke-width="3"/>
          </g>
          <text x="100" y="34" fill="#F67D56" font-size="16" font-weight="800">?</text>`;
      } else if (pose === 'empty') {
        action = `
          <g class="owl-shrug-${uid}">
            <path d="M25 56C13 55 10 67 17 76C22 81 30 79 31 72C32 65 30 57 25 56Z" fill="url(#owlWing-${uid})"/>
            <path d="M95 58C105 56 110 66 105 76C101 83 93 84 90 77C87 71 89 61 95 58Z" fill="url(#owlWing-${uid})"/>

    function generateQrSvg(seed, size = 56) {
      let hash = 0;
      for (let i = 0; i < seed.length; i++) hash = ((hash << 5) - hash) + seed.charCodeAt(i);
      const cells = 9;
      const cellSize = (size - 8) / cells;
      let rects = '';
      for (let r = 0; r < cells; r++) {
        for (let c = 0; c < cells; c++) {
          const isFinder = (r < 3 && c < 3) || (r < 3 && c >= cells - 3) || (r >= cells - 3 && c < 3);
          const bit = ((Math.abs(hash + r * 31 + c * 17) % 3) !== 0);
          if (isFinder || bit) {
            rects += `<rect x="${4 + c * cellSize}" y="${4 + r * cellSize}" width="${cellSize - 0.5}" height="${cellSize - 0.5}" fill="#111111"/>`;
          }
        }
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="shrink-0 bg-white border border-[#111111] rounded-lg">${rects}</svg>`;
    }

    function renderDemoSection() {

    function overrideDemoTile(idx) {
      const t = state.demoTiles[idx];
      if (t.type !== 'correct') {
        t.type = 'correct';
        t.mark = t.key;
        t.caption = 'Correct';
        state.demoScore += 1;
        showToast(`Verified item #${t.num} as ${t.key} (+1 pt)`);
        const el = document.getElementById('demo');
        if (el) el.innerHTML = renderDemoInner();
      }
    }

    function resetDemoTiles() {
      state.demoScore = 38;
      state.demoTiles = [

        { num: 4, mark: '—', key: 'A', type: 'blank', caption: 'Blank' },

        { q: 'What happens if a student shades two bubbles, spills ink, or leaves an item blank?', a: 'The OMR engine automatically flags blank, half-shaded, ink-spilled, or double-shaded items on the Review screen so you can inspect the aligned photo and tap to confirm or override the answer.' },
