services:
  - type: web
    name: examiq-website
    runtime: static
    rootDir: website
    buildCommand: ""
    staticPublishPath: .
    buildFilter:
      paths:
        - website/**
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
