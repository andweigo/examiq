services:
  - type: web
    name: examiq-website
    runtime: static
    rootDir: website
    buildCommand: ""
    staticPublishPath: .
    buildFilter:
      paths:
        - website/**
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
